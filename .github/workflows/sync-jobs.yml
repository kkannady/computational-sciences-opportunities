name: Sync ComputationCoE jobs
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: playwright install --with-deps chromium
      - run: python scripts/sync_jobs.py
      - name: Commit changed jobs
        run: |
          if git diff --quiet -- roles.json sync-meta.json; then
            echo "No job changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roles.json sync-meta.json
          git commit -m "Auto-sync ComputationCoE jobs"
          git push
